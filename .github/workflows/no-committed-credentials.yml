name: Guard against committed credentials

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-for-credential-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if Firebase/Play service-account files are tracked
        run: |
          # google-services.json (Android Firebase config), Firebase Admin SDK
          # service-account keys, and Play Console API service-account keys
          # (api-*-*.json) must never be committed — see frontend/.gitignore.
          matches=$(git ls-files | grep -iE \
            '(^|/)google-services\.json$|(^|/)[^/]*-firebase-adminsdk-[^/]*\.json$|(^|/)api-[^/]+-[^/]+\.json$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Credential/service-account file(s) are tracked in git — remove them and rotate the credential:"
            echo "$matches"
            exit 1
          fi
